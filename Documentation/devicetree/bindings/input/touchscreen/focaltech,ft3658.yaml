%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft3658.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FocalTech FT3658 SPI touchscreen controller

maintainers:
  - sidharthify <wednisegit@gmail.com>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: focaltech,ft3658

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  avdd-supply:
    description: Analog power supply

  vdd-supply:
    description: Digital power supply

  spi-max-frequency:
    maximum: 10000000

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - avdd-supply
  - vdd-supply
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "focaltech,ft3658";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupt-parent = <&gpa7>;
            interrupts = <0 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&gpp23 2 GPIO_ACTIVE_LOW>;
            avdd-supply = <&ts_avdd>;
            vdd-supply = <&ts_vdd>;
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2400>;
        };
    };
