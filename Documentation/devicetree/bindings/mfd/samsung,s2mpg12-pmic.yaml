%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mpg12-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG12 Power Management IC

maintainers:
  - sidharthify <wednisegit@gmail.com>

description: |
  The Samsung S2MPG12 is the main Power Management IC of Google gs201 based
  boards. It has buck converters, LDOs, a real time clock and power meters,
  and is accessed through the ACPM firmware of the SoC.

properties:
  compatible:
    const: samsung,s2mpg12-pmic

  interrupts:
    maxItems: 1

  regulators:
    type: object
    description:
      List of child nodes that specify the regulators.

    patternProperties:
      "^ldo([1-9]|1[0-9]|2[0-8])m$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

    additionalProperties: false

  wakeup-source: true

required:
  - compatible
  - interrupts
  - regulators

additionalProperties: false
